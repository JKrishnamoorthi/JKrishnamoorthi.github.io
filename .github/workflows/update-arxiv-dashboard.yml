name: Update arXiv dashboard data

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "Optional UTC date, e.g. 2026-09-26"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ------------------------------------------------------
      # Update daily arXiv statistics
      # ------------------------------------------------------

      - name: Update daily statistics
        env:
          ARXIV_STATS_DATE: ${{ inputs.date }}
        run: |
          python scripts/update_arxiv_stats.py


      # ------------------------------------------------------
      # Update favourite paper metadata
      # ------------------------------------------------------

      - name: Update favourite paper metadata
        run: |
          python scripts/update_favourites.py


      # ------------------------------------------------------
      # Commit dashboard data
      # ------------------------------------------------------

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/daily.json \
            data/metadata.json \
            data/favourites.json \
            data/favourites_metadata.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update arXiv dashboard data"
          git push
