name: Update arXiv dashboard data

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional UTC date, e.g. 2026-09-26"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update daily statistics
        env:
          ARXIV_STATS_DATE: ${{ inputs.date }}
        run: python scripts/update_arxiv_stats.py

      - name: Update favourite paper metadata
        run: python scripts/update_favourites.py

      - name: Commit dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily.json data/metadata.json data/favourites.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update arXiv dashboard data"
          git push
